# Build the book on every push and pull request; deploy main to GitHub Pages.
# Recreated 2026-11-16; first run passed on GitHub the same day.
name: build

on:
  push:
    branches: ['**']   # branches only: the latest-build tag must not start a run
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish the PDF to the "Latest build" release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with latexmk (shell-escape for cached TikZ figures)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_shell_escape: true
          pre_compile: mkdir -p figures-cache

      - name: Check the log
        run: |
          ! grep -q '^!' main.log
          ! grep -q 'undefined' main.log
          if grep -q 'Overfull' main.log; then grep 'Overfull' main.log; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compress the release PDF
        run: |
          python3 -m pip install --quiet pymupdf
          mkdir -p site
          python3 tools/compress_pdf.py main.pdf site/Physics.pdf
          cp tools/index.html site/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: Physics
          path: site/Physics.pdf

      # Every push to main moves the tag latest-build to this commit and replaces the
      # PDF on its release, so the download link below never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/Physics.pdf
      - name: Publish the PDF to the "Latest build" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-build
          git push -f origin refs/tags/latest-build
          notes="Built automatically from commit ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title "Latest build" --notes "$notes" --latest
          else
            gh release create latest-build --title "Latest build" --notes "$notes" --latest
          fi
          gh release upload latest-build site/Physics.pdf --clobber

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Pages deploy is off until the repository variable DEPLOY_PAGES is set to true
  # (Settings > Secrets and variables > Actions > Variables). A private repo needs a
  # paid plan for Pages; until then the PDF is still available as the build artifact.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
